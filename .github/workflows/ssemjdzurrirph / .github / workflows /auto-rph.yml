# SISTEN — Auto-jana RPH setiap 30 minit (percuma, tanpa perlu aplikasi dibuka)
name: Auto RPH SISTEN
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
concurrency:
  group: auto-rph
  cancel-in-progress: false
jobs:
  jana:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsx scripts/auto-rph-cron.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
